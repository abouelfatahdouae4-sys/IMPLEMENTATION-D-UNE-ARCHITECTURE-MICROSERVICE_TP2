spring.application.name=config-service
server.port=9999

# --- Option 1 (par defaut) : lecture directe du dossier config-repo (profil native) ---
# Fonctionne que l'application soit lancee depuis la racine du projet ou depuis config-service/
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo/,file:../config-repo/

# --- Option 2 : depot Git (comme dans la video) ---
# 1) cd config-repo && git init && git add . && git commit -m "config"
# 2) commenter les 2 lignes "native" ci-dessus et decommenter :
#spring.cloud.config.server.git.uri=file:///C:/chemin/vers/micro-services-app/config-repo
#spring.cloud.config.server.git.default-label=master
# ou un depot GitHub :
#spring.cloud.config.server.git.uri=https://github.com/<votre-user>/config-repo
#spring.cloud.config.server.git.default-label=main

eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=*
